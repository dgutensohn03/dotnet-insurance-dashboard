name: Deploy Blazor to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run unit tests
        run: dotnet test InsuranceDashboard.Tests/InsuranceDashboard.Tests.csproj -c Release --verbosity normal
      - name: Publish Blazor client
        run: dotnet publish InsuranceDashboard.Client/InsuranceDashboard.Client.csproj -c Release -o release
      - name: Configure GitHub Pages base path
        shell: bash
        run: |
          sed -i 's#<base href="/" />#<base href="/dotnet-insurance-dashboard/" />#' release/wwwroot/index.html
          touch release/wwwroot/.nojekyll
          cp release/wwwroot/index.html release/wwwroot/404.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  e2e:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium webkit
      - name: Run end-to-end tests
        working-directory: e2e
        env:
          BASE_URL: https://dgutensohn03.github.io/dotnet-insurance-dashboard/
        run: npm test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
